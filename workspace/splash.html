<style>
  :root {
    --bg: #F4FBF4;
    --bg2: #FFFFFF;
    --ink: #1B3D1B;
    --muted: #5D8A5D;
    --rule: #C8E6C9;
    --accent: #2E7D32;
    --accent2: #81C784;
    --accent-light: #E8F5E9;
    --accent-dark: #1B5E20;
    --yellow: #FFEB3B;
    --yellow-soft: #FFF9C4;
    --pink: #FF80AB;
    --cyan: #4DD0E1;
    --orange: #FFB74D;
    --red: #EF5350;
    --purple: #BA68C8;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  /* ===== Memphis Background ===== */
  .memphis-bg {
    position: fixed; inset: 0;
    z-index: 0; pointer-events: none;
    overflow: hidden;
  }

  /* Subtle dot grid */
  .mb-dots {
    position: absolute; inset: 0;
    opacity: 0.08;
    background-image: radial-gradient(circle, var(--accent) 1.5px, transparent 1.5px);
    background-size: 60px 60px;
  }

  /* Memphis shapes - scattered, hand-drawn feel */
  .mb-shape {
    position: absolute;
    opacity: 0.7;
  }

  /* Circle - top left */
  .mb-s1 {
    top: 6%; left: 7%;
    width: 48px; height: 48px;
    border: 3px solid var(--ink);
    border-radius: 50%;
    background: transparent;
    transform: rotate(-5deg);
  }

  /* Half circle - top right */
  .mb-s2 {
    top: 5%; right: 8%;
    width: 56px; height: 28px;
    background: var(--yellow);
    border: 3px solid var(--ink);
    border-radius: 56px 56px 0 0;
    transform: rotate(20deg);
  }

  /* Cross - left middle */
  .mb-s3 {
    top: 40%; left: 4%;
    width: 30px; height: 30px;
    position: absolute;
  }
  .mb-s3::before, .mb-s3::after {
    content: '';
    position: absolute;
    background: var(--accent);
    border: 2.5px solid var(--ink);
  }
  .mb-s3::before {
    top: 50%; left: 0; right: 0; height: 8px;
    transform: translateY(-50%);
  }
  .mb-s3::after {
    left: 50%; top: 0; bottom: 0; width: 8px;
    transform: translateX(-50%);
  }

  /* Triangle - bottom left */
  .mb-s4 {
    bottom: 8%; left: 10%;
    width: 0; height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-bottom: 38px solid var(--cyan);
    opacity: 0.5;
    transform: rotate(-15deg);
  }

  /* Dashed line - right */
  .mb-s5 {
    top: 35%; right: 5%;
    width: 4px; height: 100px;
    border-left: 4px dashed var(--pink);
    opacity: 0.6;
  }

  /* Small dots cluster - bottom right */
  .mb-s6 {
    bottom: 12%; right: 10%;
    width: 60px; height: 60px;
    position: absolute;
  }
  .mb-s6::before {
    content: '···';
    position: absolute;
    font-size: 3rem;
    color: var(--orange);
    line-height: 0.5;
    letter-spacing: 0.2em;
    opacity: 0.5;
    top: 0; left: 0;
  }

  /* Wavy line SVG container */
  .mb-wave {
    position: absolute;
    opacity: 0.4;
  }
  .mb-wave.w1 { top: 15%; left: 20%; width: 120px; }
  .mb-wave.w2 { bottom: 20%; right: 18%; width: 100px; transform: rotate(180deg); }

  /* Spiral - left bottom */
  .mb-spiral {
    position: absolute;
    bottom: 18%; left: 6%;
    width: 40px; height: 40px;
    opacity: 0.4;
  }

  /* ===== Main Content ===== */
  .splash-content {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%;
    padding: 2rem;
  }

  /* Vertical name - top to bottom */
  .vertical-name {
    display: flex; flex-direction: column;
    align-items: center;
    gap: 0.15rem;
    margin-bottom: 1.8rem;
    position: relative;
  }

  .v-char {
    font-size: 3.2rem;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.05;
    position: relative;
    animation: charDrop 0.5s ease backwards;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 3.6rem;
    height: 3.6rem;
  }

  .v-char:nth-child(1) { animation-delay: 0.1s; }
  .v-char:nth-child(2) { animation-delay: 0.2s; }
  .v-char:nth-child(3) { animation-delay: 0.3s; }
  .v-char:nth-child(4) { animation-delay: 0.4s; }
  .v-char:nth-child(5) { animation-delay: 0.5s; }
  .v-char:nth-child(6) { animation-delay: 0.6s; }
  .v-char:nth-child(7) { animation-delay: 0.7s; }

  @keyframes charDrop {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Character styling */
  .v-char.accent { color: var(--accent); }
  .v-char.highlight {
    position: relative;
  }
  .v-char.highlight::after {
    content: '';
    position: absolute;
    left: 50%; transform: translateX(-50%);
    bottom: 0.2rem;
    width: 80%; height: 10px;
    background: var(--yellow);
    z-index: -1;
    border-radius: 2px;
    opacity: 0.6;
  }

  /* Divider line */
  .divider {
    width: 2px; height: 20px;
    background: var(--rule);
    margin: 0.3rem 0;
  }

  /* English part - vertical */
  .v-en {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--muted);
    line-height: 1.1;
    font-style: italic;
    letter-spacing: 0.05em;
  }

  /* Leaf icon top */
  .leaf-icon {
    font-size: 2rem;
    margin-bottom: 0.8rem;
    opacity: 0.8;
  }

  /* Subtitle */
  .splash-subtitle {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    margin-top: 0.3rem;
    font-weight: 600;
    animation: fadeIn 1s ease 0.8s backwards;
    position: relative;
  }
  .splash-subtitle::before,
  .splash-subtitle::after {
    content: '';
    display: inline-block;
    width: 20px; height: 1.5px;
    background: var(--rule);
    vertical-align: middle;
    margin: 0 0.6rem;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Enter button */
  .enter-btn {
    margin-top: 2rem;
    padding: 0.75rem 2.2rem;
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 3px 3px 0 var(--ink);
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    animation: fadeIn 0.8s ease 1s backwards;
    position: relative;
  }
  .enter-btn:hover {
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .enter-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--ink);
  }

  /* Loading dots */
  .loading-dots {
    margin-top: 1.2rem;
    display: flex;
    gap: 0.4rem;
    animation: fadeIn 0.8s ease 1.2s backwards;
  }
  .ld {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent2);
    animation: dotPulse 1.4s ease infinite;
  }
  .ld:nth-child(2) { animation-delay: 0.2s; }
